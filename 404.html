<script>
  // Pages are built as /path/name/index.html, so /path/name.html doesn't exist.
  // Redirect /path/name.html (or /path/name/index.html) to /path/name/, keeping any query or hash.
  (function () {
    var match = location.pathname.match(/^(.+?)(?:\/index)?\.html$/);
    if (match) {
      location.replace(match[1] + "/" + location.search + location.hash);
    }
  })();
</script>
